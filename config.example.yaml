# Top-level server configuration block.
server:
  # Address and port the HTTP server binds to. Format: host:port.
  # Read at startup only (a hot reload does not rebind).
  listen_address: 0.0.0.0:8080

# These values default to 120s, 30s, and 30s when omitted.
# How long to wait after a provider failure before allowing it to be retried.
cooldown: 120s
# How long to wait before probing a recovered provider again.
recovery_wait: 30s
# Max time to wait for response headers from an upstream provider before timing out.
response_header_timeout: 30s

# Optional: the longest one request may spend finding a provider (failovers and
# recovery waits included) before it gets a 503 no_provider_available. 0 or
# omitted = wait until a provider answers or the client cancels. Clients can
# shorten it per request with the X-Gonka-Max-Routing-Time header.
# max_routing_time: 60s

# Treat provider HTTP 404 responses as failover failures. Defaults to false.
failover_on_404: false

# Treat provider HTTP 401/403 responses (the provider rejected its API key) as
# failover failures that cool the whole provider. Defaults to false, which
# passes them back to the client unchanged.
failover_on_auth_error: false

# Minimum log level to emit (INFO, WARN, or ERROR).
# Defaults to WARN. INFO includes detailed lifecycle diagnostics (Provider
# selection and successes, Cooldown and Recovery Wait transitions, and
# cancellation). WARN suppresses those INFO-only events but retains Failover
# Failure and stream-abort events. ERROR is the strictest threshold and emits
# only ERROR-level events. At INFO, errors may include bounded Provider error
# messages or stream tails; prompts, request bodies, authorization headers, and
# API keys are never logged, and response content is suppressed at WARN/ERROR.
log_level: WARN

# Reasoning effort forwarded to every upstream request. Allowed values:
# none, low, medium, high, xhigh, max, null.
# Set to null (~) to disable forwarding and strip any client-supplied reasoning_effort.
# This field is required — omitting it fails validation.
# Default when you want reasoning: max. Most of providers already support it. See README for details.
reasoning_effort: max

# Optional: let clients choose reasoning_effort themselves. A valid client value
# then beats model defaults and the global value (never a provider override);
# an invalid one is answered with 400. Defaults to false (client values are
# overwritten). Each model below can override this.
# allow_client_reasoning_effort: false

# Optional per-Virtual-Model settings (Virtual Model = the "model" clients send).
# models:
#   chat-fast:
#     reasoning_effort: low               # default effort for this model (~ strips it)
#   chat-smart:
#     reasoning_effort: high
#     allow_client_reasoning_effort: true # overrides the top-level switch

# List of upstream LLM providers the proxy can route to. These are placeholders,
# not real credentials. Each entry: name (unique id), base_url (API endpoint),
# api_key (auth), priority (higher = preferred; equal priorities keep YAML
# order), and exactly one of:
#   model_alias: one upstream model used for every Virtual Model (legacy), or
#   models:      a map Virtual Model -> upstream model; the provider then
#                serves only the listed Virtual Models.
# Copy a block to add another provider. An empty list is valid (every request
# then gets 503 until providers are pushed through the admin API).
#
# Optional per-provider reasoning_effort overrides every other source for that
# provider with any allowed value; null (~) strips the field entirely (for
# providers that reject the parameter); omit it to inherit.
# Optional enabled: false keeps a provider configured but out of rotation.
providers:
  - name: primary
    base_url: https://provider.example/v1
    api_key: replace-with-provider-key
    model_alias: provider-model-name
    priority: 100
  - name: backup
    base_url: https://backup.example/v1
    api_key: replace-with-provider-key
    model_alias: backup-model-name
    priority: 50
    reasoning_effort: ~
  # Multi-model provider:
  # - name: gate-a
  #   base_url: https://gate-a.example/v1
  #   api_key: replace-with-provider-key
  #   priority: 80
  #   enabled: true
  #   models:
  #     chat-fast: provider-fast-model
  #     chat-smart: provider-smart-model
