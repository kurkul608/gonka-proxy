services:
  gonka-proxy:
    build: .
    container_name: gonka-proxy
    command: ["--config", "/etc/gonka-proxy/config.yaml"]
    ports:
      - "127.0.0.1:58081:8080"
    volumes:
      - ./config.yaml:/etc/gonka-proxy/config.yaml:ro
    # Optional (see README, "Access tokens" and "Admin API"):
    # environment:
    #   GONKA_PROXY_CLIENT_TOKEN: ${GONKA_PROXY_CLIENT_TOKEN}   # required on /v1/*
    #   GONKA_PROXY_ADMIN_TOKEN: ${GONKA_PROXY_ADMIN_TOKEN}     # enables /admin/*, min 16 chars
    #   GONKA_PROXY_ADMIN_LISTEN_ADDRESS: 0.0.0.0:8081           # admin API on its own port
    #   GONKA_PROXY_ADMIN_PERSIST: "true"                        # write pushed configs back;
    #                                                            # mount the config directory rw
    restart: unless-stopped
